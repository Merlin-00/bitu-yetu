<main class="max-width">
  @if (loading()) {
    <app-product-skeleton />
  } @else {
    <div class="produit-container">
      @if (product) {
        <img [src]="product.image" alt="product image" />
        <div class="product-info">
          <p>
            <b>{{ product.title }}</b>
          </p>
          <p>{{ product.category }}</p>
          <p>
            <b>$ {{ product.price }}</b>
          </p>
          <div class="quantity-container">
            <span class="label">Quantité :</span>

            <div class="quantity-box">
              <button
                class="quant"
                [disabled]="productQty() === 1"
                (click)="qtyHandling('minus')"
              >
                -
              </button>

              <span class="qty-value">
                {{ productQty() }}
              </span>

              <button
                class="quant"
                [disabled]="productQty() === 5"
                (click)="qtyHandling('add')"
              >
                +
              </button>
            </div>
          </div>
          <hr />
          <span>
            <b>Total: ${{ product.price! * productQty() }} </b>
          </span>
          <button (click)="addToCard(product)" class="panier">
            Ajouter au panier
          </button>
          <br />
          <hr />
          <p>{{ product.description }}</p>
        </div>
      } @else {
        <p class="center">Aucun produit trouvé</p>
      }
    </div>
  }
  <br /><br />
  <app-product-list
    productTitle="Ceci pourrait aussi vous plaire"
    query="allProducts"
  />
  <br /><br />
</main>
